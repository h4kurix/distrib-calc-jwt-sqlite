services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    env_file: .env
    environment:
      # Внутренний порт фиксирован. PORT снаружи меняет только маппинг.
      - PORT=8080
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file: .env
    environment:
      - ORCHESTRATOR_HOST=orchestrator
      - ORCHESTRATOR_PORT=8080
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge
